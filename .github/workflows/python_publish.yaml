# WARN: The name of this workflow file is directly connected to PyPi for automatic deployment.
# If you change the name, you must also change it in the PyPi settings for this repository.
name: Upload Python Package

on:
  push:
    tags:
      - '*.*.*'

env:
  GITHUB_RELEASE: True

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel poetry
      - name: Build and publish
        run: |
          poetry build
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_PASSWORD }}
